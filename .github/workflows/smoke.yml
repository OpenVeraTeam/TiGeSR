name: Release smoke checks

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/train.txt
          python -m pip check
      - name: Test imports, losses and annotation geometry
        run: python -m unittest discover -s tests -v
      - name: Check standalone command-line entry points
        run: |
          python scripts/inference.py --help
          python scripts/make_ocr_annotations.py --help
          python scripts/evaluate.py --help
          python scripts/download_weights.py --list
